name: Blink CAS Shard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-blink-cas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run Blink cas-v1 shard & GN overlay verification
        run: node --test test/blink-cas.test.mts
